name: test

on:
  workflow_dispatch:

jobs:
  generate-app-token:
    runs-on: ubuntu-latest
    
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: getsentry/action-github-app-token@v2
        with:
          app_id: ${{ secrets.TDEPS_APP }}
          private_key: ${{ secrets.TDEPS_APP_KEY }}
          
      - name: Use the generated token
        run: |
          echo "Using the generated token"
          curl -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" https://api.github.com/user
